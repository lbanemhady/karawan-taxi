<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تطبيق السائق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Tajawal', sans-serif; }
</style>
</head>
<body class="bg-slate-100 min-h-screen">

<!-- شاشة الدخول / التسجيل -->
<div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-sm">
    <div class="text-center mb-5">
      <div class="text-4xl mb-2">🚗</div>
      <h1 class="text-xl font-bold">تطبيق السائق</h1>
      <p class="text-slate-400 text-sm">أدخل رقم هاتفك للمتابعة</p>
    </div>
    <input id="login-phone" type="tel" placeholder="07xxxxxxxxx" class="w-full border border-slate-300 rounded-lg px-3 py-3 mb-3 text-center" dir="ltr" />
    <button id="login-btn" class="w-full bg-amber-400 hover:bg-amber-300 text-slate-900 font-bold py-3 rounded-lg">متابعة</button>
    <p id="login-error" class="text-red-500 text-sm text-center mt-2 hidden"></p>
  </div>
</div>

<!-- شاشة التسجيل لسائق جديد -->
<div id="register-screen" class="hidden min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-sm">
    <h2 class="font-bold text-lg mb-4 text-center">تسجيل سائق جديد</h2>
    <div class="space-y-3">
      <input id="reg-name" type="text" placeholder="الاسم الكامل" class="w-full border border-slate-300 rounded-lg px-3 py-2.5" />
      <input id="reg-id" type="text" placeholder="رقم الهوية" class="w-full border border-slate-300 rounded-lg px-3 py-2.5" dir="ltr" />
      <input id="reg-car" type="text" placeholder="نوع السيارة" class="w-full border border-slate-300 rounded-lg px-3 py-2.5" />
      <input id="reg-plate" type="text" placeholder="رقم اللوحة" required class="w-full border border-slate-300 rounded-lg px-3 py-2.5" dir="ltr" />
      <select id="reg-area" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white"></select>
    </div>
    <button id="register-btn" class="w-full bg-slate-900 text-white font-bold py-3 rounded-lg mt-4">تسجيل والدخول</button>
    <p class="text-slate-400 text-xs text-center mt-3">بعد التسجيل تواصل مع الشركة لتفعيل اشتراكك</p>
  </div>
</div>

<!-- التطبيق الرئيسي -->
<div id="app" class="hidden max-w-lg mx-auto p-4 pb-24">
  <div class="flex items-center justify-between mb-4 pt-2">
    <div>
      <h1 id="driver-name" class="text-xl font-black text-slate-800"></h1>
      <p id="driver-phone" class="text-slate-400 text-sm" dir="ltr"></p>
      <p id="driver-sub-number" class="text-slate-500 text-xs mt-0.5"></p>
    </div>
    <button id="logout-btn" class="text-slate-400 text-sm">خروج</button>
  </div>

  <!-- حالة الاشتراك -->
  <div id="sub-banner" class="rounded-xl p-3 mb-4 text-center font-bold text-sm"></div>

  <!-- زر الاتصال -->
  <div class="bg-white rounded-2xl p-5 shadow-sm mb-4 flex items-center justify-between">
    <div>
      <div class="font-bold">حالتي</div>
      <div id="online-status-text" class="text-sm text-slate-400">غير متصل</div>
    </div>
    <button id="online-toggle" class="w-16 h-9 rounded-full bg-slate-300 relative transition-colors">
      <span id="toggle-dot" class="absolute top-1 right-1 w-7 h-7 bg-white rounded-full shadow transition-transform"></span>
    </button>
  </div>

  <!-- الرحلة الحالية -->
  <div id="current-ride-box" class="hidden bg-blue-50 border border-blue-200 rounded-2xl p-4 mb-4">
    <div class="font-bold text-blue-800 mb-2">🚕 رحلتك الحالية</div>
    <div id="current-ride-content" class="text-sm text-slate-700 space-y-1"></div>
    <div class="flex gap-2 mt-3">
      <button id="ride-progress-btn" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg text-sm"></button>
    </div>
  </div>

  <!-- الطلبات المتاحة -->
  <div>
    <h2 class="font-bold mb-3">📋 الطلبات المتاحة</h2>
    <div id="requests-list" class="space-y-3"></div>
    <p id="requests-empty" class="text-slate-400 text-sm text-center py-8">لا توجد طلبات حاليًا</p>
  </div>
</div>

<script type="module">
import { db } from "./firebase-init.js";
import {
  doc, getDoc, setDoc, updateDoc, collection, query, where, orderBy,
  onSnapshot, runTransaction, serverTimestamp, getDocs
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

let AREAS = ["المنطقة 1", "المنطقة 2", "المنطقة 3"];
let driverId = null;
let driverData = null;
let unsubRides = null;
let unsubCurrent = null;

function sanitizePhone(p) { return p.replace(/[^0-9]/g, ""); }

// تحميل المناطق من الإعدادات
(async () => {
  try {
    const snap = await getDoc(doc(db, "settings", "config"));
    if (snap.exists() && snap.data().areas) AREAS = snap.data().areas;
  } catch (e) {}
  document.getElementById('reg-area').innerHTML = AREAS.map(a => `<option value="${a}">${a}</option>`).join("");
})();

// استرجاع تسجيل دخول سابق من هذا الجهاز
const savedPhone = localStorage.getItem('driver-phone');
if (savedPhone) tryLogin(savedPhone, true);

document.getElementById('login-btn').onclick = () => {
  const phone = document.getElementById('login-phone').value.trim();
  if (!phone) return;
  tryLogin(phone, false);
};

async function tryLogin(phoneRaw, silent) {
  const id = sanitizePhone(phoneRaw);
  if (!id) { if (!silent) showLoginError("يرجى إدخال رقم صحيح"); return; }
  const ref = doc(db, "drivers", id);
  const snap = await getDoc(ref);
  if (snap.exists()) {
    driverId = id;
    driverData = snap.data();
    localStorage.setItem('driver-phone', id);
    enterApp();
  } else if (!silent) {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('register-screen').classList.remove('hidden');
    document.getElementById('register-btn').dataset.phone = id;
  }
}

function showLoginError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg; el.classList.remove('hidden');
}

async function getNextSubscriberNumber() {
  const counterRef = doc(db, "settings", "counters");
  return await runTransaction(db, async (tx) => {
    const snap = await tx.get(counterRef);
    const current = snap.exists() && snap.data().nextSubscriberNumber ? snap.data().nextSubscriberNumber : 1001;
    tx.set(counterRef, { nextSubscriberNumber: current + 1 }, { merge: true });
    return current;
  });
}

document.getElementById('register-btn').onclick = async () => {
  const id = document.getElementById('register-btn').dataset.phone;
  const name = document.getElementById('reg-name').value.trim();
  const idNumber = document.getElementById('reg-id').value.trim();
  const car = document.getElementById('reg-car').value.trim();
  const plate = document.getElementById('reg-plate').value.trim();
  const area = document.getElementById('reg-area').value;
  if (!name || !car || !plate) { alert("يرجى تعبئة الاسم ونوع السيارة ورقم اللوحة"); return; }
  const btn = document.getElementById('register-btn');
  btn.disabled = true; btn.textContent = "جارِ التسجيل...";
  const subscriberNumber = await getNextSubscriberNumber();
  const data = {
    name, phone: id, idNumber, carModel: car, carPlate: plate, area,
    subscriberNumber,
    status: "offline", subscriptionPaidUntil: null, lat: null, lng: null,
    createdAt: serverTimestamp(),
  };
  await setDoc(doc(db, "drivers", id), data);
  driverId = id; driverData = data;
  localStorage.setItem('driver-phone', id);
  btn.disabled = false; btn.textContent = "تسجيل والدخول";
  enterApp();
};

document.getElementById('logout-btn').onclick = () => {
  localStorage.removeItem('driver-phone');
  location.reload();
};

function enterApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('register-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('driver-name').textContent = driverData.name || "";
  document.getElementById('driver-phone').textContent = driverData.phone || "";
  document.getElementById('driver-sub-number').textContent = driverData.subscriberNumber ? ("رقم المشترك: " + driverData.subscriberNumber + " · اللوحة: " + (driverData.carPlate || "")) : "";
  renderSubBanner();
  renderOnlineToggle(driverData.status === 'online');
  listenCurrentRide();
  listenAvailableRides();
}

function isSubscriptionActive() {
  if (!driverData || !driverData.subscriptionPaidUntil) return false;
  return new Date(driverData.subscriptionPaidUntil) >= new Date();
}

function renderSubBanner() {
  const el = document.getElementById('sub-banner');
  if (isSubscriptionActive()) {
    const d = new Date(driverData.subscriptionPaidUntil);
    el.className = "rounded-xl p-3 mb-4 text-center font-bold text-sm bg-emerald-100 text-emerald-700";
    el.textContent = "✅ اشتراكك ساري لغاية " + d.toLocaleDateString('ar-EG');
  } else {
    el.className = "rounded-xl p-3 mb-4 text-center font-bold text-sm bg-red-100 text-red-700";
    el.textContent = "⚠️ اشتراكك غير مفعّل — تواصل مع الشركة لتفعيله قبل الاتصال";
  }
}

function renderOnlineToggle(isOnline) {
  const btn = document.getElementById('online-toggle');
  const dot = document.getElementById('toggle-dot');
  const text = document.getElementById('online-status-text');
  if (isOnline) {
    btn.classList.remove('bg-slate-300'); btn.classList.add('bg-emerald-500');
    dot.style.transform = 'translateX(-28px)';
    text.textContent = "متصل الآن — تستقبل الطلبات";
  } else {
    btn.classList.add('bg-slate-300'); btn.classList.remove('bg-emerald-500');
    dot.style.transform = 'translateX(0)';
    text.textContent = "غير متصل";
  }
}

document.getElementById('online-toggle').onclick = async () => {
  const goingOnline = driverData.status !== 'online';
  if (goingOnline && !isSubscriptionActive()) {
    alert("لا يمكنك الاتصال قبل تفعيل الاشتراك اليومي. تواصل مع الشركة.");
    return;
  }
  let lat = null, lng = null;
  if (goingOnline && navigator.geolocation) {
    try {
      const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { timeout: 5000 }));
      lat = pos.coords.latitude; lng = pos.coords.longitude;
    } catch (e) { /* السماحية غير متاحة — نتابع بدون إحداثيات */ }
  }
  const newStatus = goingOnline ? 'online' : 'offline';
  await updateDoc(doc(db, "drivers", driverId), { status: newStatus, lat, lng, updatedAt: serverTimestamp() });
  driverData.status = newStatus;
  renderOnlineToggle(newStatus === 'online');
};

// ---- الرحلة الحالية ----
function listenCurrentRide() {
  if (unsubCurrent) unsubCurrent();
  const q = query(collection(db, "rides"), where("driverId", "==", driverId), where("status", "in", ["assigned", "enroute"]));
  unsubCurrent = onSnapshot(q, (snap) => {
    const box = document.getElementById('current-ride-box');
    if (snap.empty) { box.classList.add('hidden'); return; }
    const d = snap.docs[0];
    const r = d.data();
    box.classList.remove('hidden');
    document.getElementById('current-ride-content').innerHTML = `
      <div>📍 الانطلاق: ${escapeHtml(r.pickupText || "")} (${escapeHtml(r.pickupArea||"")})</div>
      <div>🎯 الوجهة: ${escapeHtml(r.destinationText || "")}</div>
      <div dir="ltr">📞 ${escapeHtml(r.customerPhone || "")}</div>
      ${r.notes ? `<div>📝 ${escapeHtml(r.notes)}</div>` : ""}`;
    const btn = document.getElementById('ride-progress-btn');
    if (r.status === 'assigned') {
      btn.textContent = "بدء الرحلة";
      btn.onclick = () => updateDoc(doc(db, "rides", d.id), { status: 'enroute' });
    } else {
      btn.textContent = "إنهاء الرحلة";
      btn.onclick = () => updateDoc(doc(db, "rides", d.id), { status: 'completed', completedAt: serverTimestamp() });
    }
  });
}

// ---- الطلبات المتاحة ----
function listenAvailableRides() {
  if (unsubRides) unsubRides();
  const q = query(collection(db, "rides"), where("status", "==", "pending"), orderBy("createdAt", "desc"));
  unsubRides = onSnapshot(q, (snap) => {
    const list = document.getElementById('requests-list');
    const empty = document.getElementById('requests-empty');
    list.innerHTML = "";
    if (snap.empty) { empty.classList.remove('hidden'); return; } else { empty.classList.add('hidden'); }

    const docs = snap.docs.slice().sort((a, b) => {
      const ra = a.data(), rb = b.data();
      const sameA = ra.pickupArea === driverData.area ? 0 : 1;
      const sameB = rb.pickupArea === driverData.area ? 0 : 1;
      return sameA - sameB;
    });

    docs.forEach(d => {
      const r = d.data();
      const sameArea = r.pickupArea === driverData.area;
      const card = document.createElement('div');
      card.className = "bg-white rounded-xl p-4 shadow-sm border " + (sameArea ? "border-amber-300" : "border-slate-200");
      card.innerHTML = `
        ${sameArea ? '<div class="text-xs font-bold text-amber-600 mb-1">🔥 في منطقتك</div>' : ''}
        <div class="font-bold text-slate-800">${escapeHtml(r.pickupArea||"")} → ${escapeHtml(r.destinationText || "")}</div>
        <div class="text-sm text-slate-500 mt-1">📍 ${escapeHtml(r.pickupText || "")}</div>
        ${r.notes ? `<div class="text-xs text-slate-400 mt-1">${escapeHtml(r.notes)}</div>` : ""}
        <button data-id="${d.id}" class="accept-btn w-full bg-emerald-500 hover:bg-emerald-400 text-white font-bold py-2.5 rounded-lg mt-3">✅ قبول المشوار</button>`;
      list.appendChild(card);
    });

    document.querySelectorAll('.accept-btn').forEach(b => {
      b.onclick = () => acceptRide(b.dataset.id, b);
    });
  });
}

async function acceptRide(rideId, btn) {
  if (!isSubscriptionActive()) { alert("لا يمكنك قبول طلبات قبل تفعيل اشتراكك."); return; }
  btn.disabled = true; btn.textContent = "جارِ القبول...";
  const rideRef = doc(db, "rides", rideId);
  try {
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(rideRef);
      if (!snap.exists() || snap.data().status !== 'pending') {
        throw new Error("تم قبول هذا الطلب من سائق آخر");
      }
      tx.update(rideRef, {
        status: "assigned",
        driverId: driverId,
        driverName: driverData.name,
        assignedAt: serverTimestamp(),
      });
    });
  } catch (e) {
    alert(e.message || "تعذّر قبول الطلب");
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
